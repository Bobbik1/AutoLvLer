<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magiczny Grimoire - Potter RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Georgia&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121019;
            --card-bg: #221d2d;
            --gold: #d4af37;
            --gold-bright: #ffdf00;
            --parchment: #f4e8c1;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--parchment);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        h1, h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            text-align: center;
            margin-top: 5px;
        }

        .profile-selector {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 15px;
        }

        .profile-btn {
            background: #1a1624;
            color: var(--parchment);
            border: 1px solid var(--gold);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Cinzel', serif;
        }

        .profile-btn.active {
            background: var(--gold);
            color: var(--bg-dark);
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--gold);
            margin-bottom: 15px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-box label {
            display: block;
            font-size: 0.85em;
            color: var(--gold);
            margin-bottom: 3px;
        }

        .stat-box input {
            width: 50px;
            text-align: center;
            background: var(--parchment);
            border: 1px solid var(--gold);
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .btn {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: var(--bg-dark);
            border: none;
            padding: 10px 18px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1em;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            margin-top: 5px;
        }

        .btn:hover {
            background: var(--gold-bright);
            box-shadow: 0 0 10px var(--gold-bright);
        }

        .spell-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--gold);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-top: 15px;
        }

        .circles-display {
            font-size: 1.8em;
            letter-spacing: 5px;
            margin: 15px 0;
        }

        .console-box {
            background: #000;
            color: #00ff66;
            font-family: monospace;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 0.9em;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .search-box {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            background: var(--parchment);
            border: 1px solid var(--gold);
            border-radius: 4px;
        }

        .checkbox-list {
            max-height: 250px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--gold);
            padding: 10px;
            border-radius: 6px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.9em;
        }

        .checkbox-item input {
            margin-right: 10px;
        }

        .manual-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🧙‍♂️ Magiczny Grimoire</h1>

    <!-- Wybór Profilu (1-4) -->
    <div class="profile-selector" id="profile-selector">
        <button class="profile-btn active" onclick="switchProfile(0)">Postać 1</button>
        <button class="profile-btn" onclick="switchProfile(1)">Postać 2</button>
        <button class="profile-btn" onclick="switchProfile(2)">Postać 3</button>
        <button class="profile-btn" onclick="switchProfile(3)">Postać 4</button>
    </div>

    <!-- EKRAN 1: SETUP -->
    <div id="setup-screen">
        <h2>🔮 Konfiguracja Czarodzieja</h2>
        <div style="margin-bottom: 10px;">
            <label style="color: var(--gold); font-size: 0.9em;">Imię Postaci:</label>
            <input type="text" id="char-name" class="search-box" value="Nicolaus Saltzenfast">
        </div>

        <div class="stats-grid">
            <div class="stat-box"><label>OFF</label><input type="number" id="off-val" value="2"></div>
            <div class="stat-box"><label>DEF</label><input type="number" id="def-val" value="1"></div>
            <div class="stat-box"><label>UTL</label><input type="number" id="utl-val" value="3"></div>
            <div class="stat-box"><label>INT</label><input type="number" id="int-val" value="3"></div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <div style="flex: 1;"><label style="color: var(--gold); font-size: 0.85em;">Punkty XP:</label><input type="number" id="xp-val" class="search-box" value="120"></div>
            <div style="flex: 1;"><label style="color: var(--gold); font-size: 0.85em;">Poziom (LVL):</label><input type="number" id="lvl-val" class="search-box" value="10"></div>
        </div>

        <h2>📜 Opanowane Umiejętności</h2>
        <input type="text" id="search-input" class="search-box" placeholder="Szukaj umiejętności..." oninput="filterSpells()">
        <div id="checkboxes-container" class="checkbox-list">Ładowanie bazy 504 umiejętności...</div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn" onclick="startGrimoire()">📖 OTWÓRZ GRIMOIRE ➔</button>
            <button class="btn" style="background: #333; color: var(--gold); border: 1px solid var(--gold);" onclick="exportProfile()">💾 Eksportuj Profil</button>
        </div>
    </div>

    <!-- EKRAN 2: GRIMOIRE -->
    <div id="grimoire-screen" class="hidden">
        <button class="btn" style="width: auto; float: left; padding: 5px 12px;" onclick="showSetup()">⚙️ Ustawienia / Profil</button>
        <span id="counter-display" style="float: right; color: var(--gold); font-size: 0.9em; margin-top: 5px;"></span>
        <div style="clear: both;"></div>

        <div class="spell-card">
            <h2 id="spell-title" style="margin-bottom: 5px;">-</h2>
            <div id="spell-info" style="color: var(--gold); font-size: 0.9em; margin-bottom: 10px;"></div>
            <div id="spell-desc" style="font-style: italic; font-size: 0.95em;">-</div>
            <div class="circles-display" id="circles-box">⚪ ⚪ ⚪ ⚪ ⚪</div>
            
            <button class="btn" onclick="pickRandomSpell()">🎲 LOSUJ NOWĄ UMIEJĘTNOŚĆ</button>
            
            <div class="manual-controls">
                <button class="btn" style="background: #2e7d32; color: #fff;" onclick="manualAddCircle()">➕ Dodaj Kółko Ręcznie</button>
                <button class="btn" style="background: #1565c0; color: #fff;" onclick="manualAddXP()">✨ Dodaj XP z Lekcji</button>
            </div>
        </div>

        <button class="btn" style="margin-top: 15px; background: linear-gradient(135deg, #00b09b, #96c93d);" onclick="executeRoll()">✨ WYKONAJ ROLL (ROLL IC) ✨</button>

        <div class="console-box" id="console-output">Gotowy do wykonywania rzutów...</div>
    </div>
</div>

<script>
    let currentProfileIndex = 0;
    let spellsDB = [];
    let activeSpell = null;
    let circles = 0;
    let knownSpells = new Set();

    async function initApp() {
        try {
            const response = await fetch('spells.json');
            spellsDB = await response.json();
            loadProfileData();
            renderCheckboxes();
        } catch (e) {
            console.error("Błąd ładowania bazy zaklęć:", e);
            document.getElementById('checkboxes-container').innerHTML = "Błąd ładowania pliku spells.json!";
        }
    }

    function getProfileKey() {
        return `hp_profile_${currentProfileIndex}`;
    }

    function loadProfileData() {
        const data = JSON.parse(localStorage.getItem(getProfileKey()) || JSON.stringify({
            name: currentProfileIndex === 0 ? "Nicolaus Saltzenfast" : `Postać ${currentProfileIndex + 1}`,
            stats: {off: 2, def: 1, utl: 3, int: 3},
            xp: 120,
            lvl: 10,
            knownSpells: []
        }));

        document.getElementById('char-name').value = data.name;
        document.getElementById('off-val').value = data.stats.off;
        document.getElementById('def-val').value = data.stats.def;
        document.getElementById('utl-val').value = data.stats.utl;
        document.getElementById('int-val').value = data.stats.int;
        document.getElementById('xp-val').value = data.xp;
        document.getElementById('lvl-val').value = data.lvl;

        knownSpells = new Set(data.knownSpells);
    }

    function switchProfile(index) {
        saveCurrentProfile();
        currentProfileIndex = index;
        
        const buttons = document.querySelectorAll('.profile-btn');
        buttons.forEach((btn, idx) => {
            if(idx === index) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        loadProfileData();
        renderCheckboxes();
    }

    function saveCurrentProfile() {
        const data = {
            name: document.getElementById('char-name').value,
            stats: {
                off: parseInt(document.getElementById('off-val').value),
                def: parseInt(document.getElementById('def-val').value),
                utl: parseInt(document.getElementById('utl-val').value),
                int: parseInt(document.getElementById('int-val').value)
            },
            xp: parseInt(document.getElementById('xp-val').value),
            lvl: parseInt(document.getElementById('lvl-val').value),
            knownSpells: [...knownSpells]
        };
        localStorage.setItem(getProfileKey(), JSON.stringify(data));
    }

    function exportProfile() {
        saveCurrentProfile();
        const data = localStorage.getItem(getProfileKey());
        const blob = new Blob([data], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${document.getElementById('char-name').value.replace(/\s+/g, '_')}_profil.json`;
        a.click();
    }

    function renderCheckboxes() {
        const container = document.getElementById('checkboxes-container');
        const search = document.getElementById('search-input').value.toLowerCase();
        container.innerHTML = '';

        spellsDB.forEach(sp => {
            if (search && !sp.name.toLowerCase().includes(search)) return;

            const div = document.createElement('div');
            div.className = 'checkbox-item';
            const isChecked = knownSpells.has(sp.name) ? 'checked' : '';
            div.innerHTML = `<input type="checkbox" id="cb-${sp.name}" value="${sp.name}" ${isChecked} onchange="toggleSpell('${sp.name}')">
                             <label for="cb-${sp.name}">[${sp.category.toUpperCase()}] <b>${sp.name}</b> (${sp.type})</label>`;
            container.appendChild(div);
        });
    }

    function toggleSpell(name) {
        if (knownSpells.has(name)) knownSpells.delete(name);
        else knownSpells.add(name);
        saveCurrentProfile();
    }

    function filterSpells() { renderCheckboxes(); }

    function startGrimoire() {
        saveCurrentProfile();
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('grimoire-screen').classList.remove('hidden');
        updateCounter();
        if (!activeSpell) pickRandomSpell();
    }

    function showSetup() {
        document.getElementById('grimoire-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
        loadProfileData();
        renderCheckboxes();
    }

    function updateCounter() {
        document.getElementById('counter-display').innerText = `${document.getElementById('char-name').value} | Opanowano: ${knownSpells.size} / ${spellsDB.length}`;
    }

    function pickRandomSpell() {
        const avail = spellsDB.filter(s => !knownSpells.has(s.name));
        if (avail.length === 0) {
            alert('🎉 Gratulacje! Opanowałeś wszystkie umiejętności z bazy!');
            return;
        }
        activeSpell = avail[Math.floor(Math.random() * avail.length)];
        circles = 0;
        updateCardUI();
        logConsole(`🔮 Rozpoczęto naukę: ${activeSpell.name}`);
    }

    function updateCardUI() {
        document.getElementById('spell-title').innerText = `${activeSpell.name} [${activeSpell.category.toUpperCase()}]`;
        document.getElementById('spell-info').innerText = `Typ: ${activeSpell.type} | Próg Sukcesu: >= ${activeSpell.threshold}`;
        document.getElementById('spell-desc').innerText = activeSpell.desc || 'Brak opisu.';
        
        let cStr = '';
        for(let i=0; i<5; i++) cStr += (i < circles) ? '🟢 ' : '⚪ ';
        document.getElementById('circles-box').innerText = cStr;
    }

    function manualAddCircle() {
        if (!activeSpell) return;
        if (circles < 5) {
            circles++;
            updateCardUI();
            logConsole(`➕ Ręcznie dodano 1 kółko do ${activeSpell.name}`);
            checkSpellCompletion();
        }
    }

    function manualAddXP() {
        let xpInput = prompt("Ile punktów XP zdobyłeś na lekcji?", "10");
        if (xpInput !== null && !isNaN(xpInput)) {
            let addXp = parseInt(xpInput);
            let currentXp = parseInt(document.getElementById('xp-val').value) + addXp;
            document.getElementById('xp-val').value = currentXp;
            saveCurrentProfile();
            logConsole(`✨ Dodano ${addXp} XP z lekcji! Aktualnie: ${currentXp} XP`);
            alert(`Przyznano ${addXp} punktów XP!`);
        }
    }

    function executeRoll() {
        if (!activeSpell) return;
        if (circles >= 5) {
            alert('Ta umiejętność jest już w pełni opanowana!');
            return;
        }
        
        const stats = {
            off: parseInt(document.getElementById('off-val').value),
            def: parseInt(document.getElementById('def-val').value),
            utl: parseInt(document.getElementById('utl-val').value),
            int: parseInt(document.getElementById('int-val').value)
        };
        
        const diceCount = stats[activeSpell.type.toLowerCase()] || 3;
        
        let successes = 0;
        let rolls = [];
        for(let i=0; i<diceCount; i++) {
            let r = Math.floor(Math.random() * 100) + 1;
            rolls.push(r);
            if (r >= activeSpell.threshold) successes++;
        }

        circles = Math.min(5, circles + successes);
        updateCardUI();

        const discordCmd = `/r ${diceCount}d100>>${activeSpell.threshold-1} ${activeSpell.name}`;
        logConsole(`► ROLL ${activeSpell.name} (${diceCount}D100): [${rolls.join(', ')}]\n   Sukcesy: +${successes} Kółko | Discord: ${discordCmd}`);

        checkSpellCompletion();
    }

    function checkSpellCompletion() {
        if (circles >= 5) {
            knownSpells.add(activeSpell.name);
            saveCurrentProfile();
            updateCounter();
            setTimeout(() => alert(`🎉 Opanowałeś umiejętność: ${activeSpell.name}!`), 100);
        }
    }

    function logConsole(msg) {
        const consoleBox = document.getElementById('console-output');
        consoleBox.innerText = msg + '\n\n' + consoleBox.innerText;
    }

    window.onload = initApp;
</script>
</body>
</html>
