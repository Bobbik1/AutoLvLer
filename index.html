<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magiczny Grimoire - Potter RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Georgia&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121019;
            --card-bg: #221d2d;
            --gold: #d4af37;
            --gold-bright: #ffdf00;
            --parchment: #f4e8c1;
            --green-success: #2e7d32;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--parchment);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        h1, h2, h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            text-align: center;
            margin-top: 5px;
            margin-bottom: 10px;
        }
        .profile-selector {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 15px;
        }
        .profile-btn {
            background: #1a1624;
            color: var(--parchment);
            border: 1px solid var(--gold);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Cinzel', serif;
        }
        .profile-btn.active {
            background: var(--gold);
            color: var(--bg-dark);
            font-weight: bold;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--gold);
            margin-bottom: 15px;
        }
        .stat-box { text-align: center; }
        .stat-box label { display: block; font-size: 0.85em; color: var(--gold); margin-bottom: 3px; }
        .stat-box input {
            width: 50px; text-align: center; background: var(--parchment);
            border: 1px solid var(--gold); border-radius: 4px; font-weight: bold; font-size: 1.1em;
        }
        .btn {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: var(--bg-dark); border: none; padding: 10px 18px;
            font-family: 'Cinzel', serif; font-weight: bold; font-size: 1em;
            border-radius: 6px; cursor: pointer; width: 100%; transition: all 0.2s ease; margin-top: 5px;
        }
        .btn:hover { background: var(--gold-bright); box-shadow: 0 0 10px var(--gold-bright); }
        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
            width: auto;
        }
        .spell-card {
            background: rgba(0,0,0,0.4); border: 1px solid var(--gold);
            border-radius: 10px; padding: 20px; text-align: center; margin-top: 15px;
        }
        .circles-display { font-size: 1.8em; letter-spacing: 5px; margin: 15px 0; }
        .console-box {
            background: #000; color: #00ff66; font-family: monospace;
            padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 0.9em;
            white-space: pre-wrap; max-height: 150px; overflow-y: auto; border: 1px solid #333;
        }
        .search-box, .select-box {
            width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;
            background: var(--parchment); border: 1px solid var(--gold); border-radius: 4px;
            font-family: 'Georgia', serif;
        }
        .filter-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .section-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--gold);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .list-container {
            max-height: 180px;
            overflow-y: auto;
        }
        .item-row {
            display: flex;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            font-size: 0.9em;
        }
        .item-row input[type="radio"] {
            margin-right: 10px;
        }
        .manual-controls { display: flex; gap: 10px; margin-top: 10px; }
        .hidden { display: none; }
        .badge {
            background: var(--gold);
            color: var(--bg-dark);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
            margin-right: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧙‍♂️ Magiczny Grimoire</h1>

    <!-- WYBÓR PROFILU -->
    <div class="profile-selector" id="profile-selector">
        <button class="profile-btn active" onclick="switchProfile(0)">Postać 1</button>
        <button class="profile-btn" onclick="switchProfile(1)">Postać 2</button>
        <button class="profile-btn" onclick="switchProfile(2)">Postać 3</button>
        <button class="profile-btn" onclick="switchProfile(3)">Postać 4</button>
    </div>

    <!-- EKRAN 1: KONFIGURACJA I SELEKCJA -->
    <div id="setup-screen">
        <h2>🔮 Konfiguracja Postaci</h2>
        <div style="margin-bottom: 10px;">
            <label style="color: var(--gold); font-size: 0.9em;">Imię Postaci:</label>
            <input type="text" id="char-name" class="search-box" value="Nicolaus Saltzenfast">
        </div>

        <div class="stats-grid">
            <div class="stat-box"><label>OFF</label><input type="number" id="off-val" value="2"></div>
            <div class="stat-box"><label>DEF</label><input type="number" id="def-val" value="1"></div>
            <div class="stat-box"><label>UTL</label><input type="number" id="utl-val" value="3"></div>
            <div class="stat-box"><label>INT</label><input type="number" id="int-val" value="3"></div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div style="flex: 1;"><label style="color: var(--gold); font-size: 0.85em;">Punkty XP:</label><input type="number" id="xp-val" class="search-box" value="120"></div>
            <div style="flex: 1;"><label style="color: var(--gold); font-size: 0.85em;">Poziom (LVL):</label><input type="number" id="lvl-val" class="search-box" value="10"></div>
        </div>

        <!-- SEKCJA 1: OPANOWANE UMIEJĘTNOŚCI -->
        <div class="section-box">
            <h3>📜 Opanowane Umiejętności (5/5 Kółek)</h3>
            <div id="completed-list" class="list-container">Brak opanowanych umiejętności.</div>
        </div>

        <!-- SEKCJA 2: W TRAKCIE NAUKI -->
        <div class="section-box">
            <h3>⏳ W Trakcie Nauki</h3>
            <div id="in-progress-list" class="list-container">Brak aktywnych badań/nauki.</div>
        </div>

        <!-- SEKCJA 3: BAZA WSZYSTKICH UMIEJĘTNOŚCI Z FILTRAMI -->
        <div class="section-box">
            <h3>📚 Baza Umiejętności</h3>
            
            <div class="filter-row">
                <select id="filter-category" class="select-box" onchange="renderAllDatabaseList()">
                    <option value="ALL">-- Wszystkie lata i kategorie --</option>
                </select>

                <select id="filter-type" class="select-box" onchange="renderAllDatabaseList()">
                    <option value="ALL">-- Wszystkie typy (OFF/DEF/UTL/INT) --</option>
                    <option value="OFF">OFF (Ofensywne)</option>
                    <option value="DEF">DEF (Defensywne)</option>
                    <option value="UTL">UTL (Użytkowe)</option>
                    <option value="INT">INT (Inteligencja/Eliksiry)</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="search-input" class="search-box" placeholder="Szukaj po nazwie..." oninput="renderAllDatabaseList()" style="margin-bottom:0;">
                <button class="btn btn-small" onclick="drawFilteredRandom()">🎲 Losuj z filtrów</button>
            </div>

            <div id="database-list" class="list-container">Ładowanie bazy danych...</div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn" onclick="startGrimoire()">📖 OTWÓRZ GRIMOIRE ➔</button>
            <button class="btn" style="background: #333; color: var(--gold); border: 1px solid var(--gold);" onclick="exportProfile()">💾 Eksportuj Profil</button>
        </div>
    </div>

    <!-- EKRAN 2: GRIMOIRE -->
    <div id="grimoire-screen" class="hidden">
        <button class="btn" style="width: auto; float: left; padding: 5px 12px;" onclick="showSetup()">⚙️ Powrót do Profilu</button>
        <span id="counter-display" style="float: right; color: var(--gold); font-size: 0.9em; margin-top: 5px;"></span>
        <div style="clear: both;"></div>

        <div class="spell-card">
            <h2 id="spell-title" style="margin-bottom: 5px;">-</h2>
            <div id="spell-info" style="color: var(--gold); font-size: 0.9em; margin-bottom: 10px;"></div>
            <div id="spell-desc" style="font-style: italic; font-size: 0.95em;">-</div>
            <div class="circles-display" id="circles-box">⚪ ⚪ ⚪ ⚪ ⚪</div>
            
            <div class="manual-controls">
                <button class="btn" style="background: var(--green-success); color: #fff;" onclick="manualAddCircle()">➕ Dodaj Kółko Ręcznie</button>
                <button class="btn" style="background: #1565c0; color: #fff;" onclick="manualAddXP()">✨ Dodaj XP z Lekcji</button>
            </div>
        </div>

        <button class="btn" style="margin-top: 15px; background: linear-gradient(135deg, #00b09b, #96c93d);" onclick="executeRoll()">✨ WYKONAJ ROLL (ROLL IC) ✨</button>

        <div class="console-box" id="console-output">Gotowy do wykonywania rzutów...</div>
    </div>
</div>

<script>
    let currentProfileIndex = 0;
    let spellsDB = [];
    
    // Słownik postępu czarów dla profilu: { "NazwaCzaru": liczbaKółek (1..5) }
    let profileProgress = {}; 
    let selectedSpellName = null;

    async function loadDatabase() {
        try {
            const response = await fetch('spells.json');
            spellsDB = await response.json();
            
            populateCategoryFilter();
            loadProfileData();
            renderAllSections();
        } catch (e) {
            console.error("Błąd ładowania spells.json:", e);
            document.getElementById('database-list').innerText = "Błąd wczytywania bazy z pliku spells.json!";
        }
    }

    function populateCategoryFilter() {
        const catSelect = document.getElementById('filter-category');
        const categories = new Set();
        spellsDB.forEach(s => { if(s.category) categories.add(s.category); });

        // Dodaj unikaty z pliku do listy rozwijalnej
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.innerText = cat.toUpperCase();
            catSelect.appendChild(opt);
        });
    }

    function getProfileKey() { return `hp_profile_${currentProfileIndex}`; }

    function loadProfileData() {
        const raw = localStorage.getItem(getProfileKey());
        const data = raw ? JSON.parse(raw) : {
            name: currentProfileIndex === 0 ? "Nicolaus Saltzenfast" : `Postać ${currentProfileIndex + 1}`,
            stats: {off: 2, def: 1, utl: 3, int: 3},
            xp: 120,
            lvl: 10,
            progress: {}
        };

        document.getElementById('char-name').value = data.name;
        document.getElementById('off-val').value = data.stats.off;
        document.getElementById('def-val').value = data.stats.def;
        document.getElementById('utl-val').value = data.stats.utl;
        document.getElementById('int-val').value = data.stats.int;
        document.getElementById('xp-val').value = data.xp;
        document.getElementById('lvl-val').value = data.lvl;

        profileProgress = data.progress || {};
        selectedSpellName = data.selectedSpell || null;
    }

    function saveCurrentProfile() {
        const data = {
            name: document.getElementById('char-name').value,
            stats: {
                off: parseInt(document.getElementById('off-val').value),
                def: parseInt(document.getElementById('def-val').value),
                utl: parseInt(document.getElementById('utl-val').value),
                int: parseInt(document.getElementById('int-val').value)
            },
            xp: parseInt(document.getElementById('xp-val').value),
            lvl: parseInt(document.getElementById('lvl-val').value),
            progress: profileProgress,
            selectedSpell: selectedSpellName
        };
        localStorage.setItem(getProfileKey(), JSON.stringify(data));
    }

    function switchProfile(index) {
        saveCurrentProfile();
        currentProfileIndex = index;
        
        document.querySelectorAll('.profile-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === index);
        });

        loadProfileData();
        renderAllSections();
    }

    function renderAllSections() {
        renderCompletedList();
        renderInProgressList();
        renderAllDatabaseList();
    }

    // 1. Opanowane (5 kółek)
    function renderCompletedList() {
        const container = document.getElementById('completed-list');
        container.innerHTML = '';
        
        const completed = Object.keys(profileProgress).filter(name => profileProgress[name] >= 5);
        if (completed.length === 0) {
            container.innerText = 'Brak opanowanych umiejętności.';
            return;
        }

        completed.forEach(name => {
            const div = document.createElement('div');
            div.className = 'item-row';
            div.innerHTML = `<span class="badge">5/5 🟢</span> <b>${name}</b>`;
            container.appendChild(div);
        });
    }

    // 2. W trakcie nauki (1..4 kółka)
    function renderInProgressList() {
        const container = document.getElementById('in-progress-list');
        container.innerHTML = '';

        const inProgress = Object.keys(profileProgress).filter(name => profileProgress[name] > 0 && profileProgress[name] < 5);
        if (inProgress.length === 0) {
            container.innerText = 'Brak umiejętności w trakcie nauki.';
            return;
        }

        inProgress.forEach(name => {
            const circles = profileProgress[name];
            const div = document.createElement('div');
            div.className = 'item-row';
            const isChecked = (selectedSpellName === name) ? 'checked' : '';
            div.innerHTML = `<input type="radio" name="spell-select" value="${name}" ${isChecked} onchange="selectSpell('${name}')">
                             <span class="badge">${circles}/5 🟡</span> <b>${name}</b>`;
            container.appendChild(div);
        });
    }

    // 3. Pełna baza z filtrami
    function renderAllDatabaseList() {
        const container = document.getElementById('database-list');
        container.innerHTML = '';

        const catFilter = document.getElementById('filter-category').value;
        const typeFilter = document.getElementById('filter-type').value;
        const searchVal = document.getElementById('search-input').value.toLowerCase();

        const filtered = spellsDB.filter(s => {
            if (catFilter !== 'ALL' && s.category !== catFilter) return false;
            if (typeFilter !== 'ALL' && s.type !== typeFilter) return false;
            if (searchVal && !s.name.toLowerCase().includes(searchVal)) return false;
            return true;
        });

        if (filtered.length === 0) {
            container.innerText = 'Brak umiejętności spełniających kryteria filtrów.';
            return;
        }

        filtered.forEach(s => {
            const currentCircles = profileProgress[s.name] || 0;
            const div = document.createElement('div');
            div.className = 'item-row';
            const isChecked = (selectedSpellName === s.name) ? 'checked' : '';
            
            div.innerHTML = `<input type="radio" name="spell-select" value="${s.name}" ${isChecked} onchange="selectSpell('${s.name}')">
                             <span class="badge">${currentCircles}/5 ${currentCircles === 5 ? '🟢' : '⚪'}</span>
                             <span>[${s.category.toUpperCase()}] <b>${s.name}</b> (${s.type})</span>`;
            container.appendChild(div);
        });
    }

    function selectSpell(name) {
        selectedSpellName = name;
        if (!profileProgress[name]) {
            profileProgress[name] = 0; // Inicjalizacja nauki
        }
        saveCurrentProfile();
        renderAllSections();
    }

    function drawFilteredRandom() {
        const catFilter = document.getElementById('filter-category').value;
        const typeFilter = document.getElementById('filter-type').value;
        const searchVal = document.getElementById('search-input').value.toLowerCase();

        // Losujemy tylko spośród tych, które nie są jeszcze gotowe (mniej niż 5 kółek)
        const candidates = spellsDB.filter(s => {
            if ((profileProgress[s.name] || 0) >= 5) return false;
            if (catFilter !== 'ALL' && s.category !== catFilter) return false;
            if (typeFilter !== 'ALL' && s.type !== typeFilter) return false;
            if (searchVal && !s.name.toLowerCase().includes(searchVal)) return false;
            return true;
        });

        if (candidates.length === 0) {
            alert('Brak nieopanowanych umiejętności pasujących do ustawionych filtrów!');
            return;
        }

        const picked = candidates[Math.floor(Math.random() * candidates.length)];
        selectSpell(picked.name);
        alert(`🎲 Wylosowano umiejętność: ${picked.name} [${picked.category.toUpperCase()}]`);
    }

    function startGrimoire() {
        if (!selectedSpellName) {
            alert('Wybierz jedną umiejętność z listy (zaznacz kropkę), aby otworzyć Grimoire!');
            return;
        }

        saveCurrentProfile();
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('grimoire-screen').classList.remove('hidden');
        
        updateGrimoireUI();
    }

    function showSetup() {
        document.getElementById('grimoire-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
        loadProfileData();
        renderAllSections();
    }

    function updateGrimoireUI() {
        const spellObj = spellsDB.find(s => s.name === selectedSpellName) || {
            name: selectedSpellName,
            category: 'Inne',
            type: 'UTL',
            threshold: 10,
            desc: ''
        };

        const circles = profileProgress[selectedSpellName] || 0;

        document.getElementById('spell-title').innerText = `${spellObj.name} [${spellObj.category.toUpperCase()}]`;
        document.getElementById('spell-info').innerText = `Typ: ${spellObj.type} | Próg Sukcesu: >= ${spellObj.threshold}`;
        document.getElementById('spell-desc').innerText = spellObj.desc || 'Brak opisu.';

        let cStr = '';
        for(let i=0; i<5; i++) cStr += (i < circles) ? '🟢 ' : '⚪ ';
        document.getElementById('circles-box').innerText = cStr;

        const countCompleted = Object.values(profileP
